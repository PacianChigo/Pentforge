[project]
name = "pentforge"
version = "0.1.0"
description = "Pentest report generator — parse nmap XML, generate client-ready HTML reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["pentesting", "reporting", "nmap", "cybersecurity", "red-team"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "defusedxml>=0.7.1",
    "jinja2>=3.1.0",
]

[project.scripts]
pentforge = "pentforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pentforge"]
